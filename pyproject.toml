[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[project]
name = "larex-action-sbbbin"
version = "0.1.0"
description = "Runs SBB Binarization on selected image files."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "larex-action-sdk[fastapi]>=0.14.0",
    "pydantic-settings>=2.15.0",
    "sbbbin",
]

[tool.uv.sources]
sbbbin = { git = "https://github.com/jahtz/sbbbin" }

[tool.ruff.lint.isort]
lines-after-imports = 2
