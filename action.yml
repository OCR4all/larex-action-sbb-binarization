version: 1
id: ...
name: SBB Binarization
description: Binarize images using SBB Binarization.
kind: PROCESSING
tags:
  - preprocessing
targets:
  - PAGE

endpoint:
  url: .../dispatch
  healthUrl: .../health
  parameterValuesUrl: .../parameter-values
  timeoutSeconds: 30
  auth:
    type: hmac
    secretRef: ...

# See https://docs.larex.kallimachos.de/actions/yaml-reference for further help
access:
  execute: CURATOR

locking:
  mode: PAGES

inputs:
  images:
    level: required

outputs:
  images:
    enabled: true
    variant: sbb-bin

concurrency:
  maxActiveRuns: 1
  scope: PROJECT

parameters:
  Model:
    type: "string"
    description: "SBB Binarization model"
    default: "sbb_25-05.pth"
    allowedValues:
      provider: "models"
