version: 1
id: <processor-id>
name: SBB Binarization
description: Binarize images using SBB Binarization.
kind: PROCESSING
tags:
  - preprocessing
targets:
  - PAGE

endpoint:
  url: http://<action-url>/dispatch
  healthUrl: http://<action-url>/health
  parameterValuesUrl: http://<action-url>/parameter-values
  timeoutSeconds: 30
  auth:
    type: hmac
    secretRef: <action-secret>

# See https://docs.larex.kallimachos.de/actions/yaml-reference for further help
access:
  execute: CURATOR

locking:
  mode: NONE

inputs:
  images:
    imageTypes: [COLOR, GRAYSCALE, BINARY]
    preferredImageType: COLOR
    level: required

outputs:
  images:
    enabled: true
    variant: sbb.bin.png

concurrency:
  maxActiveRuns: 1
  scope: PROJECT

parameters:
  Model:
    type: string
    description: SBB Binarization model
    default: <default_model>.pth
    allowedValues:
      provider: models
