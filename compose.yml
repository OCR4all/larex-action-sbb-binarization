services:
  action:
    container_name: larex-action-${NAME:?No name defined}
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${PORT:?No port defined}:9000"
    restart: unless-stopped
    volumes:
      - ${SBB_MODEL_DIR:?No model directory specified}:/models:Z
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable
