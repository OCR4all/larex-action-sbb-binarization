services:
  action-sbbbin:
    container_name: larex-action-sbbbin-dev
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      LAREX_PROCESSOR_ID: ${LAREX_PROCESSOR_ID:-sbb-binarization}
      LAREX_DISPATCH_HMAC_SECRET: ${LAREX_DISPATCH_HMAC_SECRET:?Secret required}
      LAREX_SDK_TRANSPORT_LOGGING: ${LAREX_SDK_TRANSPORT_LOGGING:-false}
      LAREX_ALLOWED_CALLBACK_ORIGINS: ${LAREX_ALLOWED_CALLBACK_ORIGINS:-http://app:8080}
      LAREX_ACTION_ROUTE_PREFIXES: ${LAREX_ACTION_ROUTE_PREFIXES:-/sbbbin}
      SBB_SUFFIX: ${SBB_SUFFIX:-.sbb.bin.png}
      SBB_DEVICE: ${SBB_DEVICE:-auto}
      SBB_MODEL_DIR: /models
      SBB_MAX_CONCURRENT_RUNS: ${SBB_MAX_CONCURRENT_RUNS:-1}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-9000}:9000"
    volumes:
      - "${SBB_MODEL_DIR}:/models"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped
    devices:
      - nvidia.com/gpu=all
    security_opt:
      - label=disable

